name: Compile Abu Track iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile SwiftUI App to IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: AbuTrack.swiftpm

      - name: Show Available Xcode Versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: List Available Schemes (Diagnostics)
        working-directory: AbuTrack.swiftpm
        run: |
          echo "=== List of Available Schemes ==="
          xcodebuild -list
          
      - name: Compile SwiftPM App
        working-directory: AbuTrack.swiftpm
        run: |
          # Dynamically determine the scheme
          SCHEME="AbuTrack"
          if xcodebuild -list | grep -q "Abu Track"; then
            SCHEME="Abu Track"
          fi
          echo "Building scheme: $SCHEME"
          
          xcodebuild -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build_output \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package App into IPA
        working-directory: AbuTrack.swiftpm
        run: |
          mkdir -p Payload
          # Diagnostics: print the contents of the build products directory to find the app
          echo "=== Diagnostic: Listing Build Products ==="
          find ./build_output/Build/Products -maxdepth 5 || true
          
          # Dynamically locate the compiled .app bundle recursively inside build output
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          # Compress into an .ipa file
          zip -r ../AbuTrack.ipa Payload
          
      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbuTrack-IPA
          path: AbuTrack.ipa
          retention-days: 7
