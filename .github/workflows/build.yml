name: Compile CamTrack Pro iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile SwiftUI App to IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Available Xcode Versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: List Available Schemes (Diagnostics)
        run: xcodebuild -list

      - name: Compile SwiftPM App
        run: |
          xcodebuild -scheme "CamTrackPro" \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build_output \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          # Dynamically locate the compiled .app bundle recursively inside build output
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          # Compress into an .ipa file
          zip -r CamTrackPro.ipa Payload
          
      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamTrackPro-IPA
          path: CamTrackPro.ipa
          retention-days: 7
